<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="data:," />
    <title>Codex Atlas · Repository workspace</title>
    <style>
      ATLAS_STYLE_DATA
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="header-identity">
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5 21L13 5l10 16H5l14-10" />
          <circle cx="5" cy="21" r="2.5" />
          <circle cx="13" cy="5" r="2.5" />
          <circle cx="23" cy="21" r="2.5" /></svg
        ><span class="brand-label">Codex Atlas</span>
      </div>
          <div class="breadcrumb"><strong id="repo-breadcrumb"></strong></div>
        </div>
        <nav class="side-nav" aria-label="Workspace">
          <button data-view="workspace"><span data-icon="overview"></span>Overview</button>

          <button data-view="documents" aria-current="page"><span data-icon="files"></span>Documents<span class="count" id="side-doc-count"></span></button>
          <button data-view="graph"><span data-icon="graph"></span>Graph</button>
          <button data-view="runs"><span data-icon="terminal"></span>Runs</button>
          <button data-view="memory"><span data-icon="inspect"></span>Memory</button>
          <button data-view="audit"><span data-icon="audit"></span>Audit<span class="count" id="side-audit-count"></span></button>
        </nav>
        <div class="header-actions">
        <button id="command-open" class="command-launch" aria-label="Commands" title="Commands (⌘K)"><span data-icon="terminal"></span><span class="command-label">Commands</span> <kbd>⌘K</kbd></button>
          <button id="chat-toggle" class="primary row" aria-label="Assistant"><span data-icon="chat"></span><span class="chat-label">Assistant</span></button>
        </div>
      </header>
      <aside class="sidebar">
        <div class="workspace-name">

          <div>
            <div class="repo-name" id="repo-name"></div>
            <div class="muted small" id="repo-branch"></div>
          </div>
        </div>

        <section id="library-browser" aria-label="Document library">
          <div class="library-heading"><span id="document-count" role="status"></span><button id="library-expand" class="flat">Expand all</button></div>
          <div id="document-category-heading" class="category-heading"></div>
          <div class="section-toolbar">
            <input
              type="search"
              id="document-search"
              aria-label="Search documents"
              placeholder="Search documents…"
            /><details class="document-filters"><summary>Filters</summary><div class="filter-options"><select id="document-category" aria-label="Document category"><option value="all">All categories</option></select><select id="document-type" aria-label="Document type">
              <option value="all">All documents</option></select
            ><select id="document-topic" aria-label="Document topic"><option value="all">All topics</option></select><select id="document-status" aria-label="Document status"><option value="all">All statuses</option></select><button id="document-organize" class="flat">Organize with AI</button></div></details>
          </div>
          <div id="document-table" class="note-list"></div>
        </section>
        <div class="side-bottom">

          <div
            class="sr-only"
            id="sidebar-snapshot"
          ></div>
        </div>
      </aside>
      <main class="sheet">
        <div class="page-head">
          <div class="row spread">
            <div class="row"><button id="library-toggle" class="flat" aria-expanded="false">Library</button><h1 id="page-title">Documents</h1></div>
            <div class="row"><button id="export-graph" class="flat">Export</button></div>
          </div>
          <div class="page-meta" id="page-meta"></div>
        </div>
        <section class="panel" id="view-workspace" aria-label="Repository overview" hidden><div id="workspace-overview" class="workspace-overview"></div></section>
        <section
          class="panel"
          id="view-graph"
          aria-label="Repository graph"
        >
          <div class="graph-layout">
            <div class="graph-main">
              <div class="graph-toolbar">
                <input
                  type="search"
                  id="graph-search"
                  aria-label="Search graph"
                  placeholder="Search paths, symbols…"
                /><select id="graph-scope" aria-label="Graph scope">
                  <option value="architecture">Connected files</option>
                  <option value="documents">Documents</option>
                  <option value="source">Source &amp; APIs</option>
                  <option value="test">Tests</option>
                  <option value="all">All file nodes</option></select
                ><select id="graph-relationship" aria-label="Relationship type"><option value="all">All relationships</option><option value="references">Document links</option><option value="depends_on">Imports</option><option value="tested_by">Test candidates</option><option value="verified_by">Verification evidence</option></select><button id="focus-node" disabled class="small">Focus</button><select id="graph-presentation" aria-label="Graph presentation"><option value="graph">Graph</option><option value="list">List</option></select>
              </div>
              <div id="graph-list" class="graph-list" hidden></div>
              <div class="canvas-wrap">
                <svg
                  id="network"
                  role="group"
                  aria-label="Interactive repository graph"
                ></svg>
                <div class="graph-controls" aria-label="Graph zoom">
                  <button id="zoom-out" aria-label="Zoom out">−</button
                  ><button id="zoom-fit">Fit</button
                  ><button id="zoom-in" aria-label="Zoom in">+</button>
                </div>
                <div class="graph-total" id="graph-total" role="status"></div>
              </div>
              <div class="legend" id="graph-legend"></div>
            </div>

          </div>
        </section>
        <section class="panel" id="view-inspector" aria-label="Selected file" hidden>
          <div class="inspector-body" id="inspector"></div>
        </section>
        <section
          class="panel"
          id="view-documents"
          aria-label="Documents"
          hidden
        >
          <article id="document-reader" class="document-reader"></article><details id="document-outline" class="document-outline"><summary>Contents</summary><nav aria-label="Document contents"></nav></details>
        </section>
        <section
          class="panel"
          id="view-audit"
          aria-label="Audit"
          hidden
        >
          <div class="summary-strip" id="audit-summary"></div>
          <div class="audit-layout">
            <div>
              <div class="row spread">
                <h2>Findings</h2>
                <select id="audit-filter" aria-label="Audit finding filter">
                  <option value="all">All findings</option>
                  <option value="stale">Stale evidence</option>
                  <option value="needs-review">Needs review</option>
                </select>
              </div>
              <div id="audit-findings" class="audit-findings"></div>
            </div>
            <button id="audit-codex">Audit implementation &amp; docs</button>
          </div>
        </section>
        <section class="panel" id="view-runs" aria-label="Runs" hidden><div id="run-list" class="journal-list"></div></section>
        <section class="panel" id="view-memory" aria-label="Memory" hidden><input id="memory-search" type="search" placeholder="Search project memory…" aria-label="Search project memory"/><div id="memory-list" class="journal-list"></div></section>
        <footer class="footer">
          <span id="footer-snapshot"></span
          ><span id="footer-note"
            ></span
          >
        </footer>
      </main>
    </div>
    <aside id="chat-drawer" class="chat-drawer" aria-label="Atlas assistant" hidden>
      <div class="chat-head"><h2>Assistant</h2><button id="chat-close" class="flat" aria-label="Close chat">×</button></div>
      <div id="chat-context" class="chat-context" hidden></div>
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"><p class="muted">What would you like to know?</p></div>
      <form id="chat-form" class="chat-form">
        <label for="chat-mode" class="sr-only">Assistant action</label>
        <select id="chat-mode">
          <option value="ask">Ask a question</option>
          <option value="task">Implement a task</option>
          <option value="docs">Write docs</option>
          <option value="audit">Audit code &amp; docs</option>
          <option value="organize">Organize documents</option>
          <option value="memory">Save project memory</option>
        </select>
        <label for="chat-input" class="sr-only">Message</label>
        <textarea id="chat-input" rows="3" maxlength="5500" placeholder="Ask about this project…"></textarea>
        <div class="row spread"><span id="chat-state" class="muted small" role="status">Read-only</span><button class="primary" type="submit">Ask</button></div>
      </form>
      <details class="recent-activity"><summary>Recent activity</summary><div id="recent-decisions"></div></details>
    </aside>
    <dialog id="command-dialog" class="command-dialog" aria-labelledby="command-title">
      <div class="row spread"><h2 id="command-title">Atlas commands</h2><button id="command-close" class="flat" aria-label="Close commands">×</button></div>
      <div class="command-list">
        <button data-command="ask"><strong>Ask about this project</strong></button>
        <button data-command="task"><strong>Implement a task</strong></button>
        <button data-command="organize"><strong>Organize documents</strong></button>
        <button data-command="docs"><strong>Write docs</strong></button>
        <button data-command="audit"><strong>Audit implementation &amp; docs</strong></button>
        <button id="command-graph">Explore graph</button><button data-command="memory"><strong>Save project memory</strong></button>
      </div>
      <details class="cli-skills"><summary>Use in Codex CLI</summary><div id="cli-skill-list"></div></details>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      ATLAS_D3_DATA;
    </script>
    <script>
      const graph = ATLAS_GRAPH_DATA;
    </script>
    <script>
      ATLAS_SCRIPT_DATA;
    </script>
  </body>
</html>
